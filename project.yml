name: HelloApp
options:
  bundleIdPrefix: dev.example
  deploymentTarget:
    iOS: "18.0"
targets:
  HelloApp:
    type: application
    platform: iOS
    sources:
      - path: HelloApp
    info:
      path: HelloApp/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.example.HelloApp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
